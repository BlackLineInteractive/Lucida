name: CI Multi-Platform Matrix

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  # =========================================================================
  # 1. macOS Builds (Apple Silicon arm64, Intel x86_64, Universal Binary)
  # =========================================================================
  macos:
    name: macOS ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: "Apple Silicon (arm64)"
            os: macos-14
            cmake_flags: "-DLUCIDA_BUILD_TESTS=ON"
            run_tests: true
          - name: "Intel (x86_64)"
            os: macos-13
            cmake_flags: "-DLUCIDA_BUILD_TESTS=ON"
            run_tests: true
          - name: "Universal (x86_64 + arm64)"
            os: macos-14
            cmake_flags: "-DLUCIDA_MACOS_UNIVERSAL=ON -DLUCIDA_PREFER_SYSTEM_DEPS=OFF -DLUCIDA_BUILD_TESTS=ON"
            run_tests: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies (Homebrew)
        run: |
          brew install sdl2 assimp ninja || brew upgrade sdl2 assimp ninja || true

      - name: Configure CMake
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo ${{ matrix.cmake_flags }}

      - name: Build engine & tools
        run: |
          cmake --build build --parallel

      - name: Run Test Suite
        if: matrix.run_tests
        run: |
          ./build/tests/lucida_tests

  # =========================================================================
  # 2. Linux Builds (x86_64 Native, ARM64 Cross)
  # =========================================================================
  linux:
    name: Linux ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: "x86_64 (Native)"
            cmake_flags: "-DLUCIDA_BUILD_TESTS=ON"
            packages: "libsdl2-dev libassimp-dev ninja-build"
            run_tests: true
          - name: "ARM64 (Cross-compile aarch64)"
            cmake_flags: "-DCMAKE_SYSTEM_NAME=Linux -DCMAKE_SYSTEM_PROCESSOR=aarch64 -DCMAKE_C_COMPILER=aarch64-linux-gnu-gcc -DCMAKE_CXX_COMPILER=aarch64-linux-gnu-g++ -DLUCIDA_PREFER_SYSTEM_DEPS=OFF -DLUCIDA_BUILD_TESTS=OFF"
            packages: "gcc-aarch64-linux-gnu g++-aarch64-linux-gnu ninja-build"
            run_tests: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends build-essential cmake git ${{ matrix.packages }}

      - name: Configure CMake
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo ${{ matrix.cmake_flags }}

      - name: Build engine & tools
        run: |
          cmake --build build --parallel

      - name: Run Test Suite
        if: matrix.run_tests
        run: |
          ./build/tests/lucida_tests

  # =========================================================================
  # 3. Windows Builds (MSVC x64, MSVC ARM64)
  # =========================================================================
  windows:
    name: Windows ${{ matrix.name }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: "x64 (MSVC 2022)"
            arch_flag: "-A x64"
            cmake_flags: "-DLUCIDA_BUILD_TESTS=ON"
            run_tests: true
          - name: "ARM64 (MSVC Snapdragon / WOA)"
            arch_flag: "-A ARM64"
            cmake_flags: "-DLUCIDA_BUILD_TESTS=OFF"
            run_tests: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configure CMake
        shell: pwsh
        run: cmake -B build -G "Visual Studio 17 2022" ${{ matrix.arch_flag }} -DCMAKE_BUILD_TYPE=RelWithDebInfo ${{ matrix.cmake_flags }}

      - name: Build engine & tools
        shell: pwsh
        run: cmake --build build --config RelWithDebInfo --parallel

      - name: Run Test Suite
        if: matrix.run_tests
        shell: pwsh
        run: .\build\tests\RelWithDebInfo\lucida_tests.exe
